<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>agent-bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="title">Агенты</span>
    <span id="summary" class="summary"></span>
    <button id="mute-all" type="button" class="icon-btn"></button>
  </header>
  <main id="list"></main>
  <section id="settings" hidden>
    <p class="group-title">Вид</p>
    <div class="group">
      <div class="setting">
        <span>Тема</span>
        <span id="set-theme" class="segmented">
          <button type="button" data-theme="system">Системная</button>
          <button type="button" data-theme="light">Светлая</button>
          <button type="button" data-theme="dark">Тёмная</button>
        </span>
      </div>
    </div>
    <p class="group-title">Список</p>
    <div class="group">
      <div class="setting">
        <span>Сколько висит «ждёт тебя»</span>
        <span class="stepper">
          <button type="button" class="step" data-step="-1" title="Меньше на минуту"></button>
          <label class="step-value"><input id="set-waiting" type="number" min="1" step="1"><span class="unit">мин</span></label>
          <button type="button" class="step" data-step="1" title="Больше на минуту"></button>
        </span>
      </div>
      <label class="setting">
        <span>Показывать системные запуски</span>
        <span class="switch"><input id="set-system" type="checkbox"><span class="track"></span></span>
      </label>
    </div>
    <p class="group-title">Звук</p>
    <div class="group">
      <div class="setting">
        <span>«Ждёт тебя»</span>
        <span class="sound-pick">
          <button type="button" class="dropdown" id="set-sound-waiting" data-key="soundWaiting"></button>
          <button type="button" class="play" data-key="soundWaiting" title="Послушать"></button>
        </span>
      </div>
      <div class="setting">
        <span>«Нужен ответ»</span>
        <span class="sound-pick">
          <button type="button" class="dropdown" id="set-sound-asking" data-key="soundAsking"></button>
          <button type="button" class="play" data-key="soundAsking" title="Послушать"></button>
        </span>
      </div>
      <label class="setting">
        <span>Тихо, если приложение сессии спереди</span>
        <span class="switch"><input id="set-quiet-front" type="checkbox"><span class="track"></span></span>
      </label>
      <div class="setting">
        <span>Громкость</span>
        <span class="volume">
          <input id="set-volume" type="range" min="0" max="100" step="5">
          <span id="volume-value" class="volume-value"></span>
        </span>
      </div>
    </div>
    <p class="hint">Свой звук — положи файл в ~/Library/Sounds (aiff, wav, mp3, m4a), он появится в списке. Всё сохраняется сразу в ~/Library/Application Support/agent-bar/settings.json</p>
  </section>
  <div id="menu" class="menu" role="listbox" hidden></div>
  <footer>
    <button id="toggle-settings" type="button"></button>
    <button id="quit" type="button"></button>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
