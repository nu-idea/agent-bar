<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>agent-bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="title">Агенты</span>
    <span id="summary" class="summary"></span>
    <button id="mute-all" type="button" class="mute"></button>
  </header>
  <main id="list"></main>
  <section id="settings" hidden>
    <label class="setting">
      <span>Сколько минут висит «ждёт тебя»</span>
      <input id="set-waiting" type="number" min="1" step="1">
    </label>
    <label class="setting">
      <span>Показывать системные (скрипты, кроны)</span>
      <input id="set-system" type="checkbox">
    </label>
    <div class="setting">
      <span>Звук «ждёт тебя»</span>
      <span class="sound-pick">
        <select id="set-sound-waiting"></select>
        <button type="button" class="play" data-for="set-sound-waiting" title="Послушать">▶</button>
      </span>
    </div>
    <div class="setting">
      <span>Звук «нужен ответ»</span>
      <span class="sound-pick">
        <select id="set-sound-asking"></select>
        <button type="button" class="play" data-for="set-sound-asking" title="Послушать">▶</button>
      </span>
    </div>
    <label class="setting">
      <span>Громкость звуков</span>
      <input id="set-volume" type="range" min="0" max="100" step="5">
    </label>
    <p class="hint">Свои звуки — положи файл в ~/Library/Sounds (aiff, wav, mp3, m4a), появится в списке.</p>
    <p class="hint">Сохраняется сразу. Файл: ~/Library/Application Support/agent-bar/settings.json</p>
  </section>
  <footer>
    <button id="toggle-settings" type="button">Настройки</button>
    <button id="quit" type="button">Выключить</button>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
