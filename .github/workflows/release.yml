# Push a tag like v0.2.0 (same as "version" in package.json) → builds .dmg and .zip for
# Apple Silicon and Intel and publishes one GitHub Release with them and notes from CHANGELOG.md.
# Ad-hoc signed only (no Apple Developer certificate), see "First launch" in README.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat release-notes.md
      # Build only; the release is created once, with all files at once. Letting electron-builder
      # publish made each architecture create its own release for the same tag (seen in v0.1.0).
      - name: Build
        run: npx electron-builder --mac --publish never
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "agent-bar ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
